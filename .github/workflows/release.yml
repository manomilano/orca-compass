name: Release

# Open contribution, closed authority: anyone can propose a change, only the maintainer releases.
# Publishing is an explicit action on `main`, never a side effect of pushing code or a tag. The
# `npm` environment asks the maintainer to approve the run, and npm accepts the package only from
# this workflow in that environment (trusted publishing), so no publish token exists to leak.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and preview the package, publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version and changelog
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the version in package.json can be released
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(npm view orcacompass version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "orcacompass@$version" version 2>/dev/null | grep -q .; then
            echo "::error::orcacompass $version is already on npm; raise the version in package.json first"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::the tag v$version already exists"
            exit 1
          fi
          node scripts/release-notes.mjs "$version" "$latest" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Checks (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:package
      - run: npm run test:install
      - name: List the files the package would contain
        if: runner.os == 'Linux'
        run: npm pack --dry-run --ignore-scripts

  publish:
    name: Publish ${{ needs.version.outputs.version }} to npm
    needs: [version, check]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/orcacompass/v/${{ needs.version.outputs.version }}
    permissions:
      contents: write # the release and its tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      # prepublishOnly rebuilds from scratch and runs the suite and the package check on what is published.
      - run: npm publish
      - name: Tag the commit and publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
